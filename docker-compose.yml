version: '3.9'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chromadb
    volumes:
      - ./chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
